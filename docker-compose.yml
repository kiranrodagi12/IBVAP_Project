version: '3.8'

services:
  # --------------------------------------------------------
  # FRONTEND (React + Vite)
  # --------------------------------------------------------
  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public

  # --------------------------------------------------------
  # BACKEND (FastAPI + YOLO)
  # --------------------------------------------------------
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://ibvap:ibvap123@db:5432/ibvap_db
      - YOLO_ENABLED=False
      - DEMO_MODE=True
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app
      - ./data:/app/data
      - ./ai:/app/ai

  # --------------------------------------------------------
  # DATABASE (PostgreSQL + PostGIS)
  # --------------------------------------------------------
  db:
    image: postgis/postgis:15-3.4
    environment:
      - POSTGRES_USER=ibvap
      - POSTGRES_PASSWORD=ibvap123
      - POSTGRES_DB=ibvap_db
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ibvap -d ibvap_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  db_data:
